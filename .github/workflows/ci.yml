name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The published package only needs Node >=18.17 (see "engines" in
  # package.json) — fetch/undici/AbortController all work there. The
  # matrix below is narrower than that because the *dev toolchain* (vite 8
  # / vitest 5) requires Node >=20.19 for vite and >=22.12 for vitest.
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

  # Exercises the client against a real Redfish HTTP server — DMTF's own
  # reference emulator — rather than a mocked fetch. Covers the read
  # surface and the action-discovery POST path (see
  # src/client.integration.test.ts for why session-auth isn't covered).
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      redfish-emulator:
        image: dmtf/redfish-interface-emulator:latest
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration test
        run: npm run test:integration
        env:
          REDFISH_TEST_BASE_URL: http://localhost:5000

  # Builds API docs with TypeDoc and publishes them to GitHub Pages.
  #
  # One-time setup: in the repo's Settings > Pages, set "Source" to
  # "GitHub Actions" (instead of a branch) so this job's deployment target
  # exists.
  docs:
    name: Docs
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        run: npm run docs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Versioning, npm publish, GitHub release, and CHANGELOG.md are all driven
  # by semantic-release from Conventional Commits on `main` (see
  # release.config.js). Uses an npm automation token stored as the
  # NPM_TOKEN repository secret for the @semantic-release/npm plugin.
  #
  # TODO: once this package is enrolled in npm Trusted Publishing
  # (https://docs.npmjs.com/trusted-publishers), add `id-token: write` to
  # this job's permissions and drop the NPM_TOKEN secret + env below —
  # @semantic-release/npm (>=12.0.2) uses the workflow's OIDC token
  # automatically when no auth token is configured and the package is
  # enrolled as a trusted publisher.
  release:
    name: Release
    needs: [test, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
